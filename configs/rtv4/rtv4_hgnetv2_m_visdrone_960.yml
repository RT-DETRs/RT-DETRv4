__include__: ['./rtv4_hgnetv2_m_visdrone.yml']

# ---------------------------------------------------------------------------
# RT-DETRv4-M on VisDrone @ 960x960 WITH DINOv3 ViT-B/16 feature distillation.
# Same rationale as rtv4_hgnetv2_s_visdrone_960.yml.
#
# NOT part of NODA / company work -- gitignored, not tracked.
#
# 960x960 was smoke-tested (2 epochs, 64/32-image subset, 1 GPU, local batch
# 4/8) and ran clean at 11.5 GB peak -- but that did NOT exercise
# Mosaic/multiscale (policy kicks in at epoch 4+). S hit a recurring
# DDP/NCCL hang during real training at its equivalent unreduced batch size
# (one rank spinning on a collective, others blocked in futex_do_wait), once
# multiscale started sampling up to 1.25x base_size -- almost certainly
# memory pressure. Dropped to 6 (2/GPU) with lr rescaled to match as a
# precaution, even though M itself hasn't been real-trained yet.
#
# Requires (already set up in this checkout):
#   - dinov3/ repo cloned at repo root
#   - pretrain/dinov3_vitb16_pretrain_lvd1689m.pth  (ViT-B/16 LVD-1689M)
#   - pip deps: ftfy termcolor submitit  (+ dinov3/requirements.txt)
#
# Launch:
#   CUDA_VISIBLE_DEVICES=0,1,2 torchrun --master_port=7777 --nproc_per_node=3 \
#     train.py -c configs/rtv4/rtv4_hgnetv2_m_visdrone_960.yml --use-amp --seed=0 \
#     -t RTv4-M-hgnet.pth
# ---------------------------------------------------------------------------

output_dir: ./outputs/rtv4_hgnetv2_m_visdrone_960

eval_spatial_size: [960, 960]     # drives the precomputed encoder pos-embed

teacher_model:
  type: "DINOv3TeacherModel"
  dinov3_repo_path: dinov3/
  dinov3_weights_path: pretrain/dinov3_vitb16_pretrain_lvd1689m.pth
  dinov3_model_type: dinov3_vitb16
  patch_size: 16
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

HybridEncoder:
  distill_teacher_dim: 768         # ViT-B/16 embed dim

RTv4Criterion:
  losses: ['mal', 'boxes', 'local', 'distill']
  weight_dict: {loss_mal: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5, loss_distill: 5}
  distill_adaptive_params:            # M-specific values from rtv4_hgnetv2_m_coco.yml
    enabled: True
    rho: 3.5
    delta: 0.25
    default_weight: 15

train_dataloader:
  dataset:
    transforms:
      ops:
        - {type: Mosaic, output_size: 384, rotation_range: 10, translation_range: [0.1, 0.1], scaling_range: [0.5, 1.5],
           probability: 1.0, fill_value: 0, use_cache: False, max_cached_images: 50, random_pop: True}
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [960, 960], }
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        epoch: [4, 49, 90]
  collate_fn:
    base_size: 960
    base_size_repeat: 6           # matches M's own COCO recipe
    mixup_epochs: [4, 49]
    stop_epoch: 90
  total_batch_size: 6             # 2 per GPU x 3 -- lowered from 12 as a precaution, see note above
  num_workers: 4

val_dataloader:
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [960, 960], }
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
  total_batch_size: 6
  num_workers: 4

# LR rescaled for total_batch_size=6 (was 0.00015/0.000015 at bs12; linear
# scale of COCO's bs32/lr4e-4 head, bs32/lr4e-5 backbone). Epoch schedule
# (epoches 102, flat_epoch 49, no_aug_epoch 12, warmup_iter 2000) is
# inherited UNCHANGED from rtv4_hgnetv2_m_visdrone.yml -- a smaller batch
# just means more gradient steps per epoch, no epoch-count change needed.
optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*bn).*$'
      lr: 0.0000075
    -
      params: '^(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.000075
  betas: [0.9, 0.999]
  weight_decay: 0.0001
