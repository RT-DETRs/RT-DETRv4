__include__: [
  '../dataset/doclaynet_detection.yml',
  '../runtime.yml',
  '../base/dataloader.yml',
  '../base/optimizer.yml',
  '../base/dfine_hgnetv2.yml',
]

output_dir: /content/drive/MyDrive/colab_outputs/rtdetrv4/rtv4_m_doclaynet_70e_dinov2

# ------------------------------------------
# Logging
# ------------------------------------------
use_wandb: True
wandb_project: rt-detrv4-doclaynet
wandb_name: rtv4_m_doclaynet_70e_dinov2

# ------------------------------------------
# Model
# ------------------------------------------
RTv4:
  backbone: HGNetv2

HGNetv2:
  name: 'B2'
  return_idx: [1, 2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True

DFINETransformer:
  num_layers: 4
  eval_idx: -1

HybridEncoder:
  distill_teacher_dim: 1024
  in_channels: [384, 768, 1536]
  hidden_dim: 256
  depth_mult: 0.67

# ------------------------------------------
# Teacher model: DINOv2
# ------------------------------------------
teacher_model:
  type: "DINOv2TeacherModel"
  dinov2_repo_path: /content/dinov2
  model_name: dinov2_vitl14_reg
  weights_path: /content/RT-DETRv4/pretrain/dinov2_vitl14_reg4_pretrain.pth
  patch_size: 14
  target_downsample_factor: 32
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

# ------------------------------------------
# Distillation / eval
# ------------------------------------------
eval_spatial_size: [640, 640]

RTv4Criterion:
  weight_dict:
    loss_distill: 10.0
  distill_adaptive_params:
    enabled: True
    rho: 3.5
    delta: 0.5
    default_weight: 10.0

# ------------------------------------------
# Optimizer
# ------------------------------------------
optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.00002
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.00002
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.
  lr: 0.0002
  betas: [0.9, 0.999]
  weight_decay: 0.0001

# ------------------------------------------
# Schedule
# ------------------------------------------
epoches: 70
flat_epoch: 35
no_aug_epoch: 14

use_amp: True

# ------------------------------------------
# Train dataloader
# Layout-friendly augmentations:
# - weaker photometric distortion
# - keep zoom-out
# - remove IoUCrop, HorizontalFlip, Mosaic, MixUp
# ------------------------------------------
train_dataloader:
  total_batch_size: 32
  num_workers: 6
  persistent_workers: True
  dataset:
    transforms:
      ops:
        - {type: RandomPhotometricDistort, p: 0.2}
        - {type: RandomZoomOut, fill: 0}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  collate_fn:
    base_size: 640
    stop_epoch: 56

# ------------------------------------------
# Val dataloader
# ------------------------------------------
val_dataloader:
  total_batch_size: 16
  num_workers: 4
  persistent_workers: True